name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build apk
        uses: MirkoMajkicProductDock/BuildAPK@v0.0.1
        with:
          flavour: release
